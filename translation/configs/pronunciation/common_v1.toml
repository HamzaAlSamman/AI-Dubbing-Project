# Pronunciation lexicon for the Arabic voice (spoken form only; the written translation is not changed).
# Separate from the translation glossary: the glossary decides WHICH Arabic word translates a term,
# this file decides HOW a Latin token that stays in the text is SPOKEN.
# Keys are matched case-insensitively on whole Latin tokens. Tokens not listed: all-caps acronyms and
# tokens of 3 letters or fewer are spelled letter by letter (x -> إكس, GPU -> جي بي يو); longer
# words are left to the voice.
version = "common_v1"

[words]
# programming keywords and common identifiers
for = "فور"
if = "إف"
else = "إلس"
elif = "إلِف"
while = "وايل"
def = "ديف"
return = "ريتيرن"
import = "إمبورت"
from = "فروم"
print = "برينت"
range = "رينج"
len = "لِن"
true = "ترو"
false = "فولس"
none = "نَن"
null = "نَل"
self = "سِلف"
class = "كلاس"
and = "آند"
or = "أور"
not = "نوت"
in = "إن"
is = "إز"
int = "إنت"
float = "فلوت"
str = "سترِنغ"
list = "ليست"
dict = "دِكت"
set = "سِت"
sum = "سَم"
max = "ماكس"
min = "مِن"
log = "لوغ"
exp = "إكسب"
abs = "آبس"
sin = "ساين"
cos = "كوس"
tan = "تان"
shape = "شيب"
reshape = "ري شيب"
dot = "دوت"
np = "نمباي"
numpy = "نمباي"
pandas = "بانداس"
torch = "تورتش"
python = "بايثون"
sigmoid = "سيغمويد"
relu = "ريلو"
softmax = "سوفت ماكس"
tanh = "تانش"
# acronyms read as words, not letters
nan = "نان"
json = "جيسون"
